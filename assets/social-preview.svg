<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Index Rebalancing research</title>
  <desc id="description">A quantitative-finance research card showing a 92-row dataset, linear regression and LSTM models, and reproducible evaluation.</desc>
  <rect width="1280" height="640" fill="#0f172a"/>
  <circle cx="1120" cy="60" r="260" fill="#0f766e" opacity="0.50"/>
  <circle cx="1180" cy="610" r="300" fill="#7c3aed" opacity="0.22"/>
  <circle cx="80" cy="640" r="220" fill="#2563eb" opacity="0.15"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="80" y="108" fill="#5eead4" font-size="22" font-weight="700" letter-spacing="4">QUANTITATIVE FINANCE RESEARCH</text>
    <text x="80" y="184" fill="#ffffff" font-size="62" font-weight="800">Index Rebalancing</text>
    <text x="80" y="232" fill="#cbd5e1" font-size="26">Can machine learning identify the 24-hour price effect?</text>
    <g transform="translate(80 300)">
      <rect width="330" height="180" rx="24" fill="#ffffff"/>
      <text x="28" y="48" fill="#64748b" font-size="17" font-weight="700">COMMITTED DATASET</text>
      <text x="28" y="112" fill="#0f172a" font-size="50" font-weight="800">92 rows</text>
      <text x="28" y="150" fill="#475569" font-size="18">3 indices  |  11 sectors</text>
    </g>
    <g transform="translate(440 300)">
      <rect width="330" height="180" rx="24" fill="#ecfeff"/>
      <text x="28" y="48" fill="#0f766e" font-size="17" font-weight="700">MODELS EXPLORED</text>
      <text x="28" y="104" fill="#134e4a" font-size="34" font-weight="800">Linear regression</text>
      <text x="28" y="148" fill="#134e4a" font-size="34" font-weight="800">plus LSTM</text>
    </g>
    <g transform="translate(800 300)">
      <rect width="400" height="180" rx="24" fill="#eef2ff"/>
      <circle cx="48" cy="54" r="22" fill="#2563eb"/>
      <path d="M38 54l8 8 16-20" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="84" y="60" fill="#1e1b4b" font-size="22" font-weight="800">Reproducible evaluation</text>
      <text x="28" y="112" fill="#475569" font-size="18">Dataset fingerprint and metrics</text>
      <text x="28" y="144" fill="#475569" font-size="18">verified continuously in CI</text>
    </g>
    <g transform="translate(80 526)" font-size="17" font-weight="700">
      <rect width="220" height="46" rx="23" fill="#ffffff" opacity="0.12"/>
      <text x="110" y="30" fill="#ffffff" text-anchor="middle">Exploratory research</text>
      <g transform="translate(236 0)"><rect width="190" height="46" rx="23" fill="#ffffff" opacity="0.12"/><text x="95" y="30" fill="#ffffff" text-anchor="middle">Not investment advice</text></g>
    </g>
    <text x="1200" y="568" fill="#c4b5fd" font-size="18" text-anchor="end">github.com/lukegeel101/Index-Rebalancing</text>
  </g>
</svg>
